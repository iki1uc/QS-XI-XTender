<script type="module">

/* --- Hyperframe (HY) --- */
const HY = 0.2;

/* --- Perspective (PE) --- */
function PE(v){ return { x: v.x*HY, y: v.y*HY }; }

/* --- Perimeter (PER) --- */
function PER(A,B){ return Math.hypot(A.x-B.x, A.y-B.y); }

/* --- Orbit (TRANS + WARB) --- */
let tTokio=0, tCorlu=0, tHH=0;

function orbit(r, speed, t){
    t.value += speed;
    return { x: Math.cos(t.value)*r, y: Math.sin(t.value)*r };
}

/* --- AIV (Drift) --- */
function AIV(v){ return { x: v.x*1.01, y: v.y*1.01 }; }

/* --- Dreieck (SYN + QUANDT) --- */
function triangle(A,B,C){
    return {
        AB: PER(A,B),
        BC: PER(B,C),
        CA: PER(C,A)
    };
}

/* --- Canvas --- */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

function loop(){
    ctx.clearRect(0,0,900,900);

    const Tokio = PE(orbit(2268,0.0004,{value:tTokio}));
    const Corlu = PE(orbit(756,0.0008,{value:tCorlu}));
    const HH    = PE(AIV(orbit(243,0.0012,{value:tHH})));

    /* Dreieck */
    ctx.strokeStyle="white";
    ctx.beginPath();
    ctx.moveTo(450+Tokio.x,450+Tokio.y);
    ctx.lineTo(450+Corlu.x,450+Corlu.y);
    ctx.lineTo(450+HH.x,450+HH.y);
    ctx.closePath();
    ctx.stroke();

    /* Punkte */
    ctx.fillStyle="cyan";
    ctx.fillRect(450+Tokio.x,450+Tokio.y,4,4);
    ctx.fillRect(450+Corlu.x,450+Corlu.y,4,4);
    ctx.fillRect(450+HH.x,450+HH.y,4,4);

    requestAnimationFrame(loop);
}

loop();

</script>
