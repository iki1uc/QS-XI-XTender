<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>QS‑XI‑XTender System</title>

    <style>
        body {
            background: black;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            background: #000;
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="cv" width="900" height="900"></canvas>

    <script type="module">

        /* ---------------- CORE ---------------- */
        import { CORE_CONSTANTS } from "./CORE/CORE_constants.js";
        import { CORE_MASS } from "./CORE/CORE_mass.js";
        import { CORE_OP } from "./CORE/CORE_Operator.js";

        /* ---------------- Q ---------------- */
        import { PLANETS } from "./Q/Q_PLANETS.js";

        /* ---------------- R (Realphysik) ---------------- */
        import { curvature } from "./R/R_curvature.js";
        import { timeDilation } from "./R/R_timeDilation.js";
        import { orbitVelocity } from "./R/R_orbitphysics.js";

        /* ---------------- S (Sensoren) ---------------- */
        import { orbit } from "./S/S_orbitengine.js";
        import { realMeasure } from "./S/S_realmeasure.js";
        import { triangle } from "./S/S_triangle.js";

        import { Tokio } from "./S/Tokio.js";
        import { HH } from "./S/HH.js";
        import { Corlu } from "./S/Corlu.js";

        /* ---------------- G (Golem) ---------------- */
        import { G_interpret } from "./G/G_interpret.js";

        /* ---------------- Z (Zone) ---------------- */
        import { inZone } from "./Z/Z_Zone.js";

        /* ---------------- UI ---------------- */
        import { drawCircle } from "./UI/UI_Draw.js";
        import { drawValues } from "./UI/UI_Values.js";
        import { drawTriangle } from "./UI/UI_Triangle.js";
        import { drawZone } from "./UI/UI_Zone.js";


        /* ---------------- CANVAS ---------------- */
        const cv = document.getElementById("cv");
        const ctx = cv.getContext("2d");


        /* ---------------- MAIN LOOP ---------------- */
        function loop(){

            ctx.clearRect(0,0,900,900);

            /* --- Orbit Positionen --- */
            const P_tokio = orbit(Tokio);
            const P_hh    = orbit(HH);
            const P_corlu = orbit(Corlu);

            /* --- Realwerte für HH (Sensorpunkt) --- */
            const real = realMeasure(CORE_MASS.real_blackhole, HH.r);

            /* --- Golemwerte --- */
            const golem = G_interpret(real);

            /* --- Zeichnen --- */
            drawCircle(ctx, 450 + P_tokio.x/10, 450 + P_tokio.y/10, 5);
            drawCircle(ctx, 450 + P_hh.x/10,    450 + P_hh.y/10,    5);
            drawCircle(ctx, 450 + P_corlu.x/10, 450 + P_corlu.y/10, 5);

            drawValues(ctx, real, golem);

            drawTriangle(
                ctx,
                { x: 450 + P_tokio.x/10, y: 450 + P_tokio.y/10 },
                { x: 450 + P_hh.x/10,    y: 450 + P_hh.y/10 },
                { x: 450 + P_corlu.x/10, y: 450 + P_corlu.y/10 }
            );

            drawZone(ctx);

            requestAnimationFrame(loop);
        }

        loop();

    </script>
</body>
</html>
