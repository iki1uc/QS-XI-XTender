<canvas id="view" width="800" height="800"></canvas>

<script type="module">
import { Q_CORE_XI } from "./Q/Q_CORE_XI.js";
import { S_OrbitEngine } from "./S/S_OrbitEngine.js";

import { Corlu } from "./S/Corlu.js";
import { HH } from "./S/HH.js";
import { Tokio } from "./S/Tokio.js";

const CORE = Q_CORE_XI.corePackage();
const Engine = new S_OrbitEngine(CORE.mass);

const ctx = document.getElementById("view").getContext("2d");

function draw(){
    ctx.clearRect(0,0,800,800);

    const planets = [
        Engine.orbit(Corlu),
        Engine.orbit(HH),
        Engine.orbit(Tokio)
    ];

    planets.forEach(p => {
        ctx.beginPath();
        ctx.arc(400 + p.x/5e10, 400 + p.y/5e10, 5, 0, Math.PI*2);
        ctx.fill();
    });

    requestAnimationFrame(draw);
}

draw();
</script>
